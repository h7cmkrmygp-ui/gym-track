# Builds an unsigned .ipa on a macOS runner. AltStore (or Sideloadly) signs it
# with a free Apple ID at install time, so no Apple Developer account is needed.
name: iOS IPA (AltStore)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner (macos-15-intel when Apple Silicon runners are saturated)
        default: macos-latest
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      # Push notifications are unavailable to free Apple IDs; we only use local ones.
      - name: Remove push entitlement
        run: |
          for f in ios/*/*.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" 2>/dev/null || true
            echo "== $f"; cat "$f"
          done

      - name: Archive (unsigned)
        run: |
          xcodebuild -version
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet

      # The archive is unsigned, so it carries no entitlements. AltStore reads them from the
      # binaries to register the app group shared with the widget, so embed them with a fake
      # signature (AltStore re-signs everything at install time).
      - name: Embed entitlements
        run: |
          brew install ldid
          APP="$RUNNER_TEMP/app.xcarchive/Products/Applications/$SCHEME.app"
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -e "$EXT" ] || continue
            NAME=$(basename "$EXT" .appex)
            BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$EXT/Info.plist")
            ldid -S"ios/$NAME/$NAME.entitlements" "$EXT/$BIN"
            echo "== $NAME"; ldid -e "$EXT/$BIN"
          done
          ldid -S"ios/$SCHEME/$SCHEME.entitlements" "$APP/$SCHEME"
          echo "== $SCHEME"; ldid -e "$APP/$SCHEME"

      - name: Package .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir Payload
          cp -R "app.xcarchive/Products/Applications/$SCHEME.app" Payload/
          zip -qry "$GITHUB_WORKSPACE/$SCHEME.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/$SCHEME.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ env.SCHEME }}.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          gh release create "$TAG" "$SCHEME.ipa" --title "$TAG" --notes "Build $TAG" \
            --target "$GITHUB_SHA" $([ "${{ github.ref_type }}" = tag ] || echo --prerelease)
